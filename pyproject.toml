[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-architecture-lab"
version = "0.1.0"
description = "A from-first-principles lab for implementing, benchmarking and comparing RAG architectures."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexi Vion" }]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
benchmark = [
  "ir-datasets[pyarrow]>=0.5.11,<1",
  "sentence-transformers>=3,<6",
]
generation = [
  "transformers>=4.45,<6",
  "torch>=2.2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
raglab = "raglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
