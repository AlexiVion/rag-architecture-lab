name: benchmark-v0

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/benchmark-v0.yml"

jobs:
  scifact-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: pip install -e ".[benchmark]"
      - name: Run full BEIR SciFact V0 benchmark
        run: raglab benchmark --dataset beir/scifact/test --pipelines bm25 dense hybrid --k 5 10
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: beir-scifact-v0-results
          path: benchmarks/results/*.json
          if-no-files-found: error
