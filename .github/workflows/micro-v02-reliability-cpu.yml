name: MICRO v0.2 reviewed-risk harness and CPU baseline

on:
  pull_request:
    paths:
      - "src/raglab/micro_v02/reviewed_eval.py"
      - "scripts/micro/benchmark_micro_v02_cpu.py"
      - "scripts/micro/evaluate_reviewed_micro_v02.py"
      - "tests/test_micro_v02_reviewed_eval.py"
      - "tests/test_micro_v02_cpu_profile.py"
      - ".github/workflows/micro-v02-reliability-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-v02-evalcpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install minimal test tools
        run: python -m pip install -e ".[dev]"
      - name: Verify reviewer protocol, leakage checks and accurate CPU instrumentation
        run: |
          python -m pytest -q tests/test_micro_v02_reviewed_eval.py tests/test_micro_v02_cpu_profile.py
      - name: Run real CPU profile of original zero-model fictional baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/micro/benchmark_micro_v02_cpu.py \
            --documents examples/micro-v02/documents.json \
            --cases examples/micro-v02/cases.json \
            --iterations 30 --top-k 1 3 \
            --output runs/micro-v02/structured_cpu_profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("runs/micro-v02/structured_cpu_profile.json").read_text())
          assert x["model_calls"] == 0
          assert len(x["configurations"]) == 2
          assert all(
            r["strict_correct_visible_fixture"] == r["fixture_cases"] == 9
            and r["wrong_accepts_visible_fixture"] == 0
            for r in x["configurations"]
          )
          assert "NOT_SCIENTIFIC" in x["status"]
          print("CPU software fixture verified (not independent neural inference)")
          PY
      - name: Save synthetic software evidence, never human-review claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-v02-zero-model-cpu-profile
          path: runs/micro-v02/structured_cpu_profile.json
          if-no-files-found: warn
          retention-days: 30
