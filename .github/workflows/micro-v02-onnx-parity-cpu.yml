name: MICRO v0.2 DeBERTa ONNX AVX2 INT8 parity on CPU

on:
  pull_request:
    paths:
      - "scripts/micro/onnx_nli_parity_cpu.py"
      - "src/raglab/evaluation/onnx_parity.py"
      - "tests/test_micro_v02_onnx_parity.py"
      - "docs/MICRO_V02_ONNX_PARITY_PROTOCOL.md"
      - ".github/workflows/micro-v02-onnx-parity-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-v02-onnx-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fp32-versus-int8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU research runtime and test tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[generation,dev]" "onnxruntime>=1.19,<2" "huggingface-hub>=0.29,<2"
          python -m pip check
      - name: Verify score and ONNX input contracts without model downloads
        run: python -m pytest -q tests/test_micro_v02_onnx_parity.py
      - name: Measure pinned real FP32 versus publisher AVX2 INT8 ONNX model
        shell: bash
        run: |
          set -euo pipefail
          python scripts/micro/onnx_nli_parity_cpu.py \
            --output-dir runs/micro-v02-onnx/deberta-xsmall \
            --batch-size 16
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runs/micro-v02-onnx/deberta-xsmall/int8_onnx_parity.json").read_text())
          assert d["dataset"]["pair_cases"] == 318
          assert d["onnx"]["providers"] == ["CPUExecutionProvider"]
          assert d["onnx"]["sha256"] == "21b14751a95520953bfcc607ceeb617de7cbeaeb6d60f4c8966716c743985337"
          assert d["fp32"]["metrics"]["n"] == d["int8"]["metrics"]["n"] == 318
          assert d["quality"]["changed_labels"] + d["quality"]["agreement_count"] == 318
          assert d["status"].startswith("REAL_CPU_PUBLIC_PAIRWISE")
          print("PINNED_CPU_ONNX_PARITY_COMPLETE; engineering result:", d["quality"]["engineering_gate"])
          PY
      - name: Preserve metrics and immutable weight hashes, not weights or source text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-v02-deberta-onnx-int8-parity
          path: runs/micro-v02-onnx/deberta-xsmall/int8_onnx_parity.json
          retention-days: 30
          if-no-files-found: warn
