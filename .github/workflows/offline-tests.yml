name: Offline research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Minimal development installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build wheel
          python -m pip check
      - name: Full deterministic test suite (no model or dataset downloads)
        run: python -m pytest -q
      - name: Verify distributable source, fixture and registry integrity
        run: python -m raglab.release_readiness
      - name: Verify CLI installation and Python distribution build
        run: |
          raglab --help
          python -m build --no-isolation
      - name: Node.js 22 for typed observatory
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build React TypeScript research observatory
        run: |
          npm install --prefix apps/observatory --no-audit --no-fund
          npm run --prefix apps/observatory check
          npm run --prefix apps/observatory build
          test -f apps/observatory/dist/index.html
          test -f apps/observatory/dist/data/demo.json
          test -f apps/observatory/dist/data/grf00-summary.public.json
          test -f apps/observatory/dist/data/grf01-summary.public.json
          test -f apps/observatory/dist/data/model_matrix.json
      - name: Audit frontend dependency security
        run: npm audit --prefix apps/observatory --audit-level=moderate
      - name: Install headless Chromium for WEB-01 browser QA
        run: npx --prefix apps/observatory playwright install --with-deps chromium
      - name: Test actual navigation, graph provenance, mobile layout and screenshots
        run: npm run --prefix apps/observatory e2e
      - name: Save verified browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web01-browser-evidence
          path: |
            apps/observatory/artifacts/screens/*.png
            apps/observatory/package-lock.json
          if-no-files-found: ignore
