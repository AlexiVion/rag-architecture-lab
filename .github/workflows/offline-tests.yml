name: Offline research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Minimal development installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          python -m pip check
      - name: Full deterministic test suite (no model or dataset downloads)
        run: python -m pytest -q
      - name: Verify distributable source, fixture and registry integrity
        run: python -m raglab.release_readiness
      - name: Verify CLI installation and Python distribution build
        run: |
          raglab --help
          python -m build --no-isolation
