name: MICRO external Ragability pairwise NLI CPU study

on:
  pull_request:
    paths:
      - "src/raglab/evaluation/ragability_conflict.py"
      - "scripts/micro/ragability_nli_cpu.py"
      - "tests/test_ragability_conflict.py"
      - "docs/MICRO_RAGABILITY_NLI_PROTOCOL.md"
      - ".github/workflows/micro-ragability-nli-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-ragability-nli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairwise-nli:
    name: ${{ matrix.model_key }} — pinned external conflict benchmark on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model_key: [minilm, deberta_xsmall]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[generation,dev]" "huggingface-hub>=0.29,<2"
          python -m pip check
      - name: Test external corpus parser, labels and group-aware metrics
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ragability_conflict.py
      - name: Run one pinned NLI checkpoint against all 43 conflict groups
        shell: bash
        run: |
          set -euo pipefail
          python scripts/micro/ragability_nli_cpu.py \
            --model-key "${{ matrix.model_key }}" \
            --output-dir "runs/micro-ragability-nli/${{ matrix.model_key }}" \
            --batch-size 16 \
            --bootstrap-repetitions 2000
      - name: Upload metrics and provenance only (no dataset text or model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-ragability-nli-${{ matrix.model_key }}
          path: |
            runs/micro-ragability-nli/${{ matrix.model_key }}/dataset_manifest.json
            runs/micro-ragability-nli/${{ matrix.model_key }}/results.json
            runs/micro-ragability-nli/${{ matrix.model_key }}/summary.md
          retention-days: 30
          if-no-files-found: warn
